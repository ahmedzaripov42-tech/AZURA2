name = "azura"
compatibility_date = "2026-04-30"
pages_build_output_dir = "."

# Cloudflare Pages production bindings are configured in the dashboard:
#   D1 binding name: DB
#   R2 binding name: MEDIA
#
# Do NOT leave placeholder database_id values here. A placeholder like
# REPLACE_WITH_CLOUDFLARE_D1_ID makes Cloudflare fail deployment with:
# "Invalid database UUID".
#
# For local Wrangler testing, use dashboard-compatible bindings or run:
#   npx wrangler pages dev . --d1 DB=azura_db --r2 MEDIA=azura-media
